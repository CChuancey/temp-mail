<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角方形，头像被裁圆后四角自然消失 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- 信封主体 -->
  <g>
    <rect x="116" y="156" width="280" height="200" rx="28" fill="#ffffff"/>
    <!-- 信封折线 -->
    <path d="M136 180 L256 268 L376 180" fill="none" stroke="#6366f1" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 340 L216 272 M372 340 L296 272" fill="none" stroke="#22d3ee" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- 通知角标：未读新邮件 -->
  <circle cx="392" cy="152" r="52" fill="#f43f5e" stroke="#ffffff" stroke-width="14"/>
</svg>
